<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmation</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#183456;font:15px Arial}.banner{background:#fff0c2;color:#755000;text-align:center;padding:10px;font-weight:bold}.wrap{max-width:680px;margin:45px auto;padding:20px}.card{background:white;border:1px solid #e0e5ec;border-radius:10px;padding:30px;text-align:center}.details{margin-top:24px;text-align:left;border:1px solid #222;padding:18px}.line{padding:10px 0;border-bottom:1px solid #e7ebf0}.line b{display:block;font-size:12px;color:#718096;margin-bottom:5px}button{background:#2468df;color:white;border:0;border-radius:5px;padding:13px 22px;font-weight:bold;cursor:pointer;margin-top:20px}.hidden{display:none}.check{width:76px;height:76px;border-radius:50%;background:#e5f7ec;color:#16834a;display:grid;place-items:center;font-size:43px;margin:auto auto 20px}.note{font-size:12px;color:#718096;line-height:1.5}</style></head><body><div class="banner"></div><main class="wrap"><section class="card" id="review"><h1>Transfer confirmed</h1><p></p><div class="details"><div class="line"><b>TRANSFER TITLE</b><span id="title">—</span></div><div class="line"><b>RECIPIENT</b><span id="recipient">—</span></div><div class="line"><b>AMOUNT</b><span id="amount">—</span></div></div><button id="confirm">Done</button><p class="note</p></section><section class="card hidden" id="done"><div class="check">✓</div><h1>Completed</h1><p></p></p><p class="note"></p><a href="dashboard.html">Return to dashboard</a></section></main><script>
let p=new URLSearchParams(location.search),r=p.get('recipient')||'—',t=p.get('title')||'—',a=(Number(p.get('amount')||0)).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' PLN';recipient.textContent=r;title.textContent=t;amount.textContent=a;confirm.addEventListener('click',()=>{review.classList.add('hidden');done.classList.remove('hidden');doneAmount.textContent=a;doneRecipient.textContent=r});
</script></body></html>
