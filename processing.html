<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Processing</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#183456;font:15px Arial}.banner{background:#fff0c2;color:#755000;text-align:center;padding:10px;font-weight:bold}.wrap{max-width:760px;margin:35px auto;padding:20px}.card{background:white;border:2px solid #222;padding:25px}.top{color:#2468df;font-weight:bold;letter-spacing:.12em}.amount{font-size:42px;font-weight:bold;margin:22px 0}.row{padding:14px 0;border-bottom:1px solid #e5e9ef}.row b{display:block;font-size:12px;color:#69788b;margin-bottom:6px;text-transform:uppercase}.btn{display:inline-block;background:#2468df;color:white;padding:13px 24px;border-radius:5px;text-decoration:none;font-weight:bold;margin-top:22px}.note{font-size:12px;color:#69788b}</style></head><body><div class="banner"></div><main class="wrap"><div class="top">CONFIRMATION</div><h1>Review your transfer</h1><div class="amount" id="amount">— PLN</div><section class="card"><h2>Transfer details</h2><div class="row"><b>Recipient details</b><span id="recipient">—</span></div><div class="row"><b>Account number</b><span id="account">—</span></div><div class="row"><b>Transfer title</b><span id="title">—</span></div><div class="row"><b>Date of transfer</b><span>Within 1 business day</span></div></section><p class="note"></p><a class="btn" id="send">Send</a></main><script>
let p=new URLSearchParams(location.search);['recipient','account','title'].forEach(k=>document.getElementById(k).textContent=p.get(k)||'—');document.getElementById('amount').textContent=(Number(p.get('amount')||0)).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' PLN';document.getElementById('send').href='confirmation.html?'+p;
</script></body></html>
